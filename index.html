<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTRB Tuisyen Riang - Game 4 Tamadun</title>
    <style>
        body { font-family: sans-serif; background: #e0f2fe; margin: 0; padding: 15px; text-align: center; }
        header { background: #1e3a8a; color: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .nav-btn { background: #0284c7; color: white; border: none; padding: 10px 15px; border-radius: 8px; margin: 3px; font-size: 1rem; font-weight: bold; }
        .card { background: white; padding: 15px; margin: 10px 0; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: left; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .game-btn { background: #ffffff; border: 2px solid #0284c7; padding: 15px; border-radius: 8px; font-size: 0.9rem; font-weight: bold; }
        .opt-btn { width: 100%; background: white; border: 2px solid #cbd5e1; padding: 12px; margin: 5px 0; border-radius: 8px; font-weight: bold; text-align: left; }
    </style>
</head>
<body>

    <header>
        <h2>✨ PTRB TUISYEN RIANG ✨</h2>
        <p>4 Tamadun Awal Dunia (Sejarah Form 1)</p>
    </header>

    <div>
        <button class="nav-btn" onclick="showFormula()">💡 口诀 Formula</button>
        <button class="nav-btn" onclick="startMatching()">🧩 配对 Matching</button>
        <button class="nav-btn" onclick="startQuiz()">⚡ 冲刺 Kuiz</button>
    </div>

    <div id="content" style="margin-top: 15px;"></div>

    <script>
        const data = [
            { name: 'Tamadun Mesopotamia', cn: '美索不达米亚', kw: 'Raja / Undang-undang / Tali air' },
            { name: 'Tamadun Mesir Purba', cn: '古埃及', kw: 'Firaun / Piramid / Sphinx' },
            { name: 'Tamadun Indus', cn: '印度河流域', kw: 'Grid / Sistem perparitan / Kertas' },
            { name: 'Tamadun Huang He', cn: '黄河文明', kw: 'Sutera / Wang syiling / Kompas' }
        ];

        function showFormula() {
            let html = '';
            data.forEach(item => {
                html += `<div class="card">
                    <h3 style="color:#1e3a8a;margin:0 0 5px 0;">${item.name} (${item.cn})</h3>
                    <p style="margin:0;color:#0284c7;font-weight:bold;">Kata Kunci: ${item.kw}</p>
                </div>`;
            });
            document.getElementById('content').innerHTML = html;
        }

        function startMatching() {
            let html = '<h3 style="color:#1e3a8a;">Sila padankan kata kunci / 点击对应匹配</h3><div class="grid">';
            data.forEach(item => {
                html += `<button class="game-btn" onclick="alert('✅ Right! ${item.name}')">${item.kw}</button>`;
                html += `<button class="game-btn" onclick="alert('✅ Right! ${item.name}')">${item.name}</button>`;
            });
            html += '</div>';
            document.getElementById('content').innerHTML = html;
        }

        function startQuiz() {
            let item = data[Math.floor(Math.random() * data.length)];
            let html = `<div class="card" style="text-align:center;">
                <h3>Kata kunci: <span style="color:#0284c7;">"${item.kw}"</span> merujuk kepada?</h3>`;
            data.forEach(d => {
                html += `<button class="opt-btn" onclick="check('${d.name}', '${item.name}')">${d.name}</button>`;
            });
            html += '</div>';
            document.getElementById('content').innerHTML = html;
        }

        function check(ans, correct) {
            if(ans === correct) {
                alert('🎉 Correct / 正确！');
                startQuiz();
            } else {
                alert('❌ Wrong / 错误！Cuba lagi');
            }
        }

        showFormula();
    </script>
</body>
</html>
